[package]
name = "mukure"
version = "0.1.0"
description = "Desktop video player with torrents, subtitles and Chromecast"
license = "MIT"
repository = "https://github.com/alvarotala/mukure"
publish = false
edition = "2021"
rust-version = "1.88"

[lib]
name = "mukure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = "1"
axum = "0.8"
async-stream = "0.3"
futures-util = "0.3"
encoding_rs = "0.8"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
mime_guess = "2"
mdns-sd = "0.21"
prost = "0.14"
rustls = "0.23"
tokio-rustls = "0.26"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt", "codec"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
rcgen = "0.14"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
