[package]
name = "mukure"
version = "0.1.0"
description = "Local-first torrent video player"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mukure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = "1"
axum = "0.8"
async-stream = "0.3"
futures-util = "0.3"
encoding_rs = "0.8"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
